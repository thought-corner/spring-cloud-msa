server:
  port: 10000

spring:
  application:
    name: order-service
  config:
    import: "optional:configserver:${CONFIG_SERVICE_URI:http://127.0.0.1:8888}"
  cloud:
    config:
      fail-fast: true
      username: ${CONFIG_SERVICE_USERNAME:config}
      password: ${CONFIG_SERVICE_PASSWORD:config1234}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/orderdb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
    username: ${MYSQL_USERNAME:msa}
    password: ${MYSQL_PASSWORD:msa1234}
  jpa:
    properties:
      hibernate:
        hbm2ddl:
          halt_on_error: true
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:127.0.0.1}
    instance-id: ${spring.application.name}:${server.port}
  client:
    refresh:
      enable: false
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://127.0.0.1:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    com.study.orderservice: DEBUG
  pattern:
    correlation: '[${spring.application.name:},%X{traceId:-},%X{spanId:-}] '
